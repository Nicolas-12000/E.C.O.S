# Render configuration for ECOS Backend (RAG only - OPTIMIZED for 512MB RAM)
services:
  - type: web
    name: ecos-api
    env: python
    region: oregon  # or your preferred region
    pythonVersion: 3.12.10
    buildCommand: pip install -r ../requirements-prod-minimal.txt
    startCommand: hypercorn app.main:app --config hypercorn.toml --bind 0.0.0.0:$PORT
    rootDir: ./backend
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: GROQ_API_KEY
        sync: false  # Set this in Render dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: https://ecos-frontend.vercel.app,http://localhost:3000
      - key: ECOS_FULL_API
        value: "false"
      - key: GRPC_PORT
        value: "0"
      - key: ECOS_ASGI_SERVER
        value: hypercorn
      # Optional database configuration
      - key: SUPABASE_URL
        sync: false  # Set if using Supabase
      - key: SUPABASE_ANON_KEY
        sync: false  # Set if using Supabase
      - key: DATABASE_URL
        sync: false  # Set if using PostgreSQL directly
      - key: SUPABASE_DB_URL
        sync: false  # Set if using Supabase database
      - key: OPENWEATHER_API_KEY
        sync: false  # Optional for weather data